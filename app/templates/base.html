<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070a12">
    <title>{% block title %}NICKY • Media Gateway{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #070a12;
            --panel: #0d1220;
            --panel-2: #11182a;
            --line: rgba(255,255,255,.09);
            --text: #f7f9ff;
            --muted: #8f9ab2;
            --cyan: #4de7ff;
            --lime: #b9ff66;
            --pink: #ff5ca8;
            --shadow: 0 24px 70px rgba(0,0,0,.42);
            --radius: 22px;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 10%, rgba(77,231,255,.09), transparent 28%),
                radial-gradient(circle at 85% 15%, rgba(255,92,168,.07), transparent 25%),
                linear-gradient(145deg, #05070d 0%, #090d17 48%, #060810 100%);
            font-family: 'Manrope', sans-serif;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .34;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, black, transparent 82%);
            z-index: -1;
        }
        a { color: inherit; text-decoration: none; }
        .site-shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 0;
            border-bottom: 1px solid var(--line);
        }
        .brand { display:flex; align-items:center; gap:13px; }
        .brand-mark {
            width: 44px; height: 44px; border-radius: 14px;
            display:grid; place-items:center;
            color:#071016; font-size:18px;
            background: linear-gradient(135deg, var(--cyan), var(--lime));
            box-shadow: 0 0 35px rgba(77,231,255,.17);
        }
        .brand-name { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; letter-spacing:.12em; }
        .brand-sub { display:block; margin-top:2px; color:var(--muted); font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
        .nav { display:flex; align-items:center; gap:8px; }
        .nav a {
            padding:10px 14px; border:1px solid transparent; border-radius:12px;
            color:#aeb7ca; font-size:13px; font-weight:700; transition:.2s ease;
        }
        .nav a:hover { color:var(--text); background:#fff; border-color:var(--line); }
        .nav .nav-cta {
            color:#061014; background:var(--cyan); border-color:transparent;
        }
        .nav .nav-cta:hover { color:#061014; background:var(--lime); transform:translateY(-1px); }
        main { padding: 58px 0 20px; }
        .eyebrow {
            display:inline-flex; align-items:center; gap:8px; padding:7px 11px;
            border:1px solid rgba(77,231,255,.2); border-radius:999px;
            background:rgba(77,231,255,.055); color:#8ef0ff;
            font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
        }
        .eyebrow i { font-size:8px; }
        .accent { color:var(--cyan); }
        .gradient-text {
            background:linear-gradient(100deg,var(--cyan),var(--lime));
            -webkit-background-clip:text; background-clip:text; color:transparent;
        }
        .panel {
            background:linear-gradient(145deg, rgba(17,24,42,.9), rgba(9,13,24,.9));
            border:1px solid var(--line); border-radius:var(--radius);
            box-shadow:var(--shadow);
        }
        .btn {
            display:inline-flex; align-items:center; justify-content:center; gap:9px;
            min-height:46px; padding:0 18px; border-radius:13px;
            border:1px solid var(--line); font-size:13px; font-weight:800;
            transition:.22s ease; cursor:pointer;
        }
        .btn-primary { color:#061014; background:linear-gradient(135deg,var(--cyan),var(--lime)); border:0; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(77,231,255,.14); }
        .btn-ghost { background:#ffffff05; color:#dce4f4; }
        .btn-ghost:hover { background:#ffffff0b; border-color:#ffffff1a; }
        .tag {
            display:inline-flex; align-items:center; gap:6px; padding:6px 9px;
            border-radius:8px; background:#ffffff08; border:1px solid var(--line);
            color:#aeb8cb; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
        }
        footer { margin-top:75px; padding:30px 0 38px; border-top:1px solid var(--line); }
        .footer-row { display:flex; justify-content:space-between; gap:20px; align-items:center; }
        .footer-brand { font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:.08em; }
        .footer-note { color:#69748b; font-size:12px; line-height:1.6; }
        .footer-links { display:flex; gap:16px; color:#8893a8; font-size:12px; }
        .footer-links a:hover { color:var(--cyan); }
        @media (max-width: 760px) {
            .site-shell { width:min(100% - 22px, 1180px); }
            .topbar { padding:16px 0; }
            .nav a:not(.nav-cta) { display:none; }
            .nav-cta { padding:9px 12px !important; }
            main { padding-top:38px; }
            .footer-row { flex-direction:column; align-items:flex-start; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="site-shell">
        <header class="topbar">
            <a class="brand" href="/">
                <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
                <span>
                    <span class="brand-name">NICKY</span>
                    <span class="brand-sub">Media Gateway</span>
                </span>
            </a>
            <nav class="nav" aria-label="Primary navigation">
                <a href="/"><i class="fa-solid fa-house"></i> Home</a>
                <a href="#features"><i class="fa-solid fa-layer-group"></i> Features</a>
                <a href="/"><i class="fa-solid fa-circle-info"></i> About</a>
                <a class="nav-cta" href="/"><i class="fa-solid fa-arrow-right"></i> Open Gateway</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <div class="footer-row">
                <div>
                    <div class="footer-brand">NICKY <span class="accent">/</span> MEDIA GATEWAY</div>
                    <div class="footer-note">Fast Telegram media delivery • Streaming • Direct links</div>
                </div>
                <div class="footer-links">
                    <a href="/"><i class="fa-solid fa-house"></i> Home</a>
                    <a href="/"><i class="fa-solid fa-shield-halved"></i> Service</a>
                    <a href="/"><i class="fa-solid fa-code"></i> Nicky</a>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
